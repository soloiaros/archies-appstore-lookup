name: daily

# 03:15 UTC. Same poll as schedule/crontab.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: data/catalog.sqlite
          key: catalog-sqlite-${{ github.run_id }}
          restore-keys: |
            catalog-sqlite-

      - run: npm run poll:momentum

      - if: always()
        run: cat data/snapshots/poll-status.json
